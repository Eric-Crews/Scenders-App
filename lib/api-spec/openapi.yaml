  /elevation:
    post:
      operationId: computeElevations
      tags: [community]
      summary: Look up ground elevation for a list of coordinates
      description: Proxies a free open elevation service. Returns one elevation (meters) per input point, or null where unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElevationInput"
      responses:
        "200":
          description: Elevations resolved
          content:
