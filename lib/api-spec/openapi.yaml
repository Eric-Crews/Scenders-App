openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: community
    description: Community-shared map datasets
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: me
    description: Authenticated user data — waypoints, datasets, regions, tracks
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: blog
    description: AI-generated trip blog posts derived from published tracks.
  - name: feedback
    description: Anonymous community feedback and discussion board with upvotes and replies.
  - name: donate
    description: Optional pay-what-you-want donations to fund development via Stripe Checkout.
  - name: support
    description: Private support requests for mapper.one users.
  - name: live
    description: Private, token-based live activity sharing by SMS.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/account:
    delete:
      tags: [Auth]
      operationId: deleteCurrentAccount
      summary: Permanently delete the signed-in account and its cloud-synced data
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Account and cloud-synced data were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionSuccess'
        '401':
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/data:
    delete:
      tags: [Auth]
      operationId: deleteCurrentData
      summary: Delete selected personal cloud data without deleting the account
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDeletionInput'
      responses:
        '200':
          description: Selected personal cloud data were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionResponse'
        '400':
          description: The requested deletion scope is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Sign-in is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: iss
          in: query
          required: false
          schema: { type: string, format: uri }
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /me/waypoints:
    get:
      tags: [me]
      operationId: listMyWaypoints
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: List of waypoints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Waypoint' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/waypoints/{id}:
    put:
      tags: [me]
      operationId: upsertMyWaypoint
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaypointInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Waypoint' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [me]
      operationId: deleteMyWaypoint
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/datasets:
    get:
      tags: [me]
      operationId: listMyDatasets
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: List of dataset summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserDatasetSummary' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/datasets/{id}:
    get:
      tags: [me]
      operationId: getMyDataset
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dataset detail with geojson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDataset' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [me]
      operationId: upsertMyDataset
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserDatasetInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDatasetSummary' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [me]
      operationId: deleteMyDataset
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/regions:
    get:
      tags: [me]
      operationId: listMyRegions
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: List of offline region metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserOfflineRegion' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/regions/{id}:
    put:
      tags: [me]
      operationId: upsertMyRegion
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserOfflineRegionInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOfflineRegion' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [me]
      operationId: deleteMyRegion
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/tracks:
    get:
      tags: [me]
      operationId: listMyTracks
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: List of track summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackSummary' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/tracks/{id}:
    get:
      tags: [me]
      operationId: getMyTrack
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Track detail with points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    put:
      tags: [me]
      operationId: upsertMyTrack
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackSummary' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [me]
      operationId: deleteMyTrack
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/tracks/{id}/share:
    post:
      tags: [me]
      operationId: shareMyTrack
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareTrackInput' }
      responses:
        '200':
          description: Share link created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareTrackResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [me]
      operationId: unshareMyTrack
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Sharing revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities:
    post:
      tags: [live]
      operationId: createMyLiveActivity
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveActivityInput' }
      responses:
        '201':
          description: Live activity created. The response states whether its private SMS was accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Too many SMS requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /live-activities:
    post:
      tags: [live]
      operationId: createAnonymousLiveActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveActivityInput' }
      responses:
        '201':
          description: Live activity created. The response states whether its private SMS was accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Too many SMS requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities/{id}:
    get:
      tags: [live]
      operationId: getMyLiveActivity
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Owner activity state, including inbox messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities/{id}/points:
    post:
      tags: [live]
      operationId: uploadMyLiveActivityPoints
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityPointBatchInput' }
      responses:
        '200':
          description: Points accepted (duplicate client ids are safe).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
        '400':
          description: Invalid points or activity already ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities/{id}/waypoints:
    post:
      tags: [live]
      operationId: uploadMyLiveActivityWaypoint
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityWaypointInput' }
      responses:
        '201':
          description: Private waypoint shared with this live activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
        '400':
          description: Invalid waypoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities/{id}/waypoint-photo-upload:
    post:
      tags: [live]
      operationId: requestMyLiveActivityWaypointPhotoUpload
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityPhotoUploadInput' }
      responses:
        '200':
          description: Short-lived private photo upload URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityPhotoUpload' }
        '400':
          description: Invalid image upload metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/live-activities/{id}/messages:
    post:
      tags: [live]
      operationId: sendMyLiveActivityMessage
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityOwnerMessageInput' }
      responses:
        '201':
          description: Message accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityMessage' }
  /me/live-activities/{id}/end:
    post:
      tags: [live]
      operationId: endMyLiveActivity
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Activity is now a completed view-only page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityOwner' }
  /me/live-activities/{id}/revoke:
    post:
      tags: [live]
      operationId: revokeMyLiveActivity
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/LiveOwnerCapabilityHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Link invalidated.
  /shared/live/{token}:
    get:
      tags: [live]
      operationId: getSharedLiveActivity
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Private live activity data for the token holder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityPublic' }
        '404':
          description: Not found or link revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /shared/live/{token}/waypoints/{waypointId}/photo:
    get:
      tags: [live]
      operationId: getSharedLiveActivityWaypointPhoto
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
        - in: path
          name: waypointId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token-protected waypoint photo.
          content:
            image/*:
              schema: { type: string, format: binary }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /shared/live/{token}/messages:
    post:
      tags: [live]
      operationId: sendSharedLiveActivityMessage
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityMessageInput' }
      responses:
        '201':
          description: Message accepted for the recorder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityMessageReceipt' }
        '400':
          description: Activity ended or invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /shared/tracks/{token}:
    get:
      tags: [shared]
      operationId: getSharedTrack
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shared track with points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedTrack' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/tracks/{id}/private-projects:
    get:
      tags: [me]
      operationId: listMyTrackPrivateProjects
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Private projects created for this route
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrivateProject' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      tags: [me]
      operationId: createPrivateProjectCheckout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivateProjectCheckoutInput' }
      responses:
        '200':
          description: Stripe Checkout session for a private project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateProjectCheckout' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Route not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Stripe is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/tracks/{id}/private-projects/test:
    post:
      tags: [me]
      operationId: createBetaPrivateProject
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
