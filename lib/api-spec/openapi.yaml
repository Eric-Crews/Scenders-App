        '200':
          description: Project with its linked routes and reports
          content: { application/json: { schema: { $ref: '#/components/schemas/FieldProjectDetail' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Project unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      tags: [projects]
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFieldProjectInput' }
      responses:
        '200':
          description: Updated project
          content: { application/json: { schema: { $ref: '#/components/schemas/FieldProject' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Owner role required
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/reports:
    get:
      tags: [projects]
      operationId: listFieldProjectReports
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reports visible on the project map
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldReport' }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      tags: [projects]
      operationId: createProjectReport
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFieldReportInput' }
      responses:
        '201':
          description: Report created
          content: { application/json: { schema: { $ref: '#/components/schemas/FieldReport' } } }
        '400':
          description: Invalid report
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/reports/{reportId}:
    get:
      tags: [projects]
      operationId: getProjectReport
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Report detail including resolution history
          content: { application/json: { schema: { $ref: '#/components/schemas/FieldReportDetail' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Report unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      tags: [projects]
      operationId: updateProjectReport
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFieldReportInput' }
      responses:
        '200':
          description: Updated report
          content: { application/json: { schema: { $ref: '#/components/schemas/FieldReport' } } }
        '400':
          description: Invalid update
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/report-photos/upload:
    post:
      tags: [projects]
      operationId: requestProjectReportPhotoUpload
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '200':
          description: Private evidence upload URL
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } }
        '401':
          description: Unauthorized
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /public-reports/{token}:
    post:
      tags: [projects]
      operationId: createPublicProjectReport
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePublicFieldReportInput' }
      responses:
        '201':
          description: Anonymous report accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicReportConfirmation' } } }
        '400':
          description: Invalid report
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Reporting link unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429':
          description: Too many reports
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /public-reports/{token}/photos/upload:
    post:
      tags: [projects]
      operationId: requestPublicProjectReportPhotoUpload
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '200':
          description: Private evidence upload URL
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } }
        '404':
          description: Reporting link unavailable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429':
          description: Too many requests
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /support/requests:
    get:
      tags: [support]
      operationId: listSupportRequests
      summary: List private support requests for staff review
      parameters:
        - $ref: '#/components/parameters/SupportStaffCookie'
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [bug, question, sharing_offline, partnership] }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high, critical] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [new, reviewed, resolved] }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: reference
          in: query
          required: false
          schema: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Private support requests matching the requested filters.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportRequest' }
        '400':
          description: Invalid support request filter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Staff authorization required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      tags: [support]
      operationId: createSupportRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupportRequestInput' }
      responses:
        '201':
          description: Private support request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSupportRequestResult' }
        '400':
          description: Invalid support request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: Too many requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /support/requests/{reference}:
    patch:
      tags: [support]
      operationId: updateSupportRequest
      summary: Mark a private support request reviewed or resolved
      parameters:
        - $ref: '#/components/parameters/SupportStaffCookie'
        - name: reference
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportRequestStatusUpdate' }
      responses:
        '200':
          description: Private support request updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportRequest' }
        '400':
          description: Invalid support request update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Staff authorization required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Support request not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: A resolved request cannot be changed back to reviewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    LiveOwnerCapabilityHeader:
      name: X-Live-Owner-Capability
      in: header
      required: false
      description: High-entropy device capability for controlling an anonymous live activity.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    SupportStaffCookie:
      name: mapper_support_review
      in: cookie
      required: false
      description: Staff review session cookie issued by the private support sign-in page.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, 'null'], format: email }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        profileImageUrl: { type: [string, 'null'] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    AccountDeletionSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    DataDeletionInput:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [route_data, private_projects, all_cloud_data]
    DataDeletionResponse:
      type: object
      required: [success, scope]
      properties:
        success: { type: boolean, const: true }
        scope:
          type: string
          enum: [route_data, private_projects, all_cloud_data]
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Waypoint:
      type: object
      required: [id, name, latitude, longitude, notes, trackId, photoUrl, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        notes: { type: [string, 'null'] }
        trackId: { type: [string, 'null'] }
        photoUrl:
          type: [string, 'null']
          pattern: '^/objects/private-project-photos/'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WaypointInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, minLength: 1 }
        latitude: { type: number }
        longitude: { type: number }
        notes: { type: [string, 'null'] }
        trackId: { type: [string, 'null'] }
        photoUrl:
          type: [string, 'null']
          pattern: '^/objects/private-project-photos/'
        createdAt: { type: string, format: date-time }
    UserDatasetSummary:
      type: object
      required: [id, name, format, color, visible, featureCount, sizeBytes, importedAt, updatedAt, communityId, bounds]
      properties:
        id: { type: string }
        name: { type: string }
        format: { type: string, enum: [geojson, kml, kmz, gpx] }
        color: { type: string }
        visible: { type: boolean }
        featureCount: { type: integer }
        sizeBytes: { type: integer }
        bounds:
          oneOf:
            - type: array
              items: { type: number }
              minItems: 4
              maxItems: 4
            - type: 'null'
        communityId: { type: [string, 'null'] }
        importedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserDataset:
      allOf:
        - $ref: '#/components/schemas/UserDatasetSummary'
        - type: object
          required: [geojson]
          properties:
            geojson:
              type: object
              additionalProperties: true
    UserDatasetInput:
      type: object
      required: [name, format, geojson]
      properties:
        name: { type: string, minLength: 1 }
        format: { type: string, enum: [geojson, kml, kmz, gpx] }
        color: { type: string }
        visible: { type: boolean }
        bounds:
          oneOf:
            - type: array
              items: { type: number }
              minItems: 4
              maxItems: 4
            - type: 'null'
        communityId: { type: [string, 'null'] }
        importedAt: { type: string, format: date-time }
        geojson:
          type: object
          additionalProperties: true
    UserOfflineRegion:
      type: object
      required: [id, name, bounds, minZoom, maxZoom, tileCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        bounds:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        minZoom: { type: integer }
        maxZoom: { type: integer }
        tileCount: { type: integer }
        createdAt: { type: string, format: date-time }
    UserOfflineRegionInput:
      type: object
      required: [name, bounds, minZoom, maxZoom, tileCount]
      properties:
        name: { type: string, minLength: 1 }
        bounds:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        minZoom: { type: integer }
        maxZoom: { type: integer }
        tileCount: { type: integer }
        createdAt: { type: string, format: date-time }
    TrackPoint:
      type: object
      required: [lat, lng, t]
      properties:
        lat: { type: number }
        lng: { type: number }
        t: { type: integer, description: "Timestamp in ms since epoch" }
        alt: { type: [number, 'null'] }
        acc: { type: [number, 'null'], description: "Horizontal accuracy in meters" }
    TrackSummary:
      type: object
      required: [id, name, color, distanceMeters, durationMs, pointCount, startedAt, endedAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string }
        distanceMeters: { type: number }
        durationMs: { type: integer }
        pointCount: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [recorded, plotted] }
        shareToken: { type: string, nullable: true }
        shareVisibility:
          type: string
          enum: [private, public]
          nullable: true
    Track:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          required: [points]
          properties:
            points:
              type: array
              items: { $ref: '#/components/schemas/TrackPoint' }
    TrackInput:
      type: object
      required: [name, points]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        color: { type: string }
        kind: { type: string, enum: [recorded, plotted] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }
    ShareTrackInput:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [private, public] }
    ShareTrackResponse:
      type: object
      required: [token, visibility, url]
      properties:
        token: { type: string }
        visibility: { type: string, enum: [private, public] }
        url: { type: string, description: "Public web URL for the shared route" }
    CreateLiveActivityInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ownerDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Recorder-provided display name. Omit only for older clients; the shared page falls back to Recorder.
        followedRoute:
          allOf:
            - $ref: '#/components/schemas/LiveActivityFollowedRoute'
          nullable: true
          description: Bounded snapshot of the one route actively being followed when sharing starts.
    LiveActivityPointInput:
      type: object
      required: [id, lat, lng, t]
      properties:
        id: { type: string, minLength: 8, maxLength: 96 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        t: { type: integer, description: Timestamp in ms since epoch }
        alt: { type: [number, 'null'] }
        acc: { type: [number, 'null'], minimum: 0 }
    LiveActivityPointBatchInput:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/LiveActivityPointInput' }
    LiveActivityWaypointInput:
      type: object
      required: [id, name, lat, lng, t]
      properties:
        id: { type: string, minLength: 8, maxLength: 96 }
        name: { type: string, minLength: 1, maxLength: 120 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        photoPath:
          type: [string, 'null']
          pattern: '^/objects/live-activity-photos/'
        t: { type: integer, description: Timestamp in ms since epoch }
    LiveActivityPhotoUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string, minLength: 1, maxLength: 128 }
    LiveActivityPhotoUpload:
      type: object
      required: [uploadURL, photoPath]
      properties:
        uploadURL: { type: string, format: uri }
        photoPath:
          type: string
          pattern: '^/objects/live-activity-photos/'
    LiveActivityMessageInput:
      type: object
      required: [message, displayName]
      properties:
        message: { type: string, minLength: 1, maxLength: 280 }
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Viewer-provided label for this message; not identity verification.
    LiveActivityOwnerMessageInput:
      type: object
      required: [message, clientMessageId]
      properties:
        message: { type: string, minLength: 1, maxLength: 280 }
        clientMessageId:
          type: string
          minLength: 8
          maxLength: 96
          description: Stable device-generated id that keeps recorder-reply retries idempotent.
    LiveActivityMessage:
      type: object
      required: [id, sender, body, createdAt]
      properties:
        id: { type: string }
        sender: { type: string, enum: [viewer, owner] }
        displayName:
          type: [string, 'null']
          description: Self-provided viewer label. Null for legacy viewer messages and owner messages.
        body: { type: string }
        createdAt: { type: string, format: date-time }
    LiveActivityMessageReceipt:
      type: object
      required: [accepted, createdAt]
      properties:
        accepted: { type: boolean }
        createdAt: { type: string, format: date-time }
    LiveActivityPublic:
      type: object
      required: [name, ownerDisplayName, followedRoute, status, startedAt, endedAt, lastUpdatedAt, distanceMeters, durationMs, pointCount, points, lastLocation, waypoints, messages]
      properties:
        name: { type: string }
        ownerDisplayName:
          type: string
          description: Recorder display name, with Recorder as the safe legacy fallback.
        followedRoute:
          allOf:
            - $ref: '#/components/schemas/LiveActivityFollowedRoute'
          nullable: true
        status: { type: string, enum: [active, completed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        lastUpdatedAt: { type: [string, 'null'], format: date-time }
        distanceMeters: { type: number }
        durationMs: { type: integer }
        pointCount: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrackPoint' }
        lastLocation:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
            t: { type: integer }
        waypoints:
          type: array
          description: Waypoints intentionally added while the private activity was active.
          items: { $ref: '#/components/schemas/LiveActivityWaypoint' }
        messages:
          type: array
          description: Full private conversation for the holder of this live-link token.
          items: { $ref: '#/components/schemas/LiveActivityMessage' }
    LiveActivityWaypoint:
      type: object
      required: [id, name, lat, lng, notes, photoUrl, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number }
        lng: { type: number }
        notes: { type: [string, 'null'] }
        photoUrl:
          type: [string, 'null']
          description: Token-protected waypoint photo URL.
        createdAt: { type: string, format: date-time }
    LiveActivityFollowedRoute:
      type: object
      required: [name, points]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        points:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: object
            required: [lat, lng]
            properties:
              lat: { type: number, minimum: -90, maximum: 90 }
              lng: { type: number, minimum: -180, maximum: 180 }
    LiveActivityOwner:
      allOf:
        - $ref: '#/components/schemas/LiveActivityPublic'
        - type: object
          required: [id, token, url, queuedPointCount]
          properties:
            id: { type: string }
            token: { type: string }
            url: { type: string, format: uri }
            queuedPointCount:
              type: integer
            ownerCapability:
              type: string
              description: Returned only when a live activity is first created; never returned by owner refreshes.
    PrivateProjectCheckoutInput:
      type: object
      description: Reserved for future private-project options.
    PrivateProjectCheckout:
      type: object
      required: [projectId, checkoutUrl]
      properties:
        projectId: { type: string }
        checkoutUrl: { type: string, format: uri }
    PrivateProjectConfirmationInput:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string }
    PrivateProject:
      type: object
      required: [id, trackId, status, isBetaTest, createdAt]
      properties:
        id: { type: string }
        trackId: { type: string }
        status: { type: string, enum: [pending, active, revoked, expired] }
        isBetaTest: { type: boolean }
        url: { type: [string, 'null'], format: uri }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    BetaPrivateSharingAccess:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    TeamsEarlyAccessInput:
      type: object
