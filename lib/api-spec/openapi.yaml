              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /community/regions:
    get:
      operationId: listCommunityRegions
      tags: [community]
      summary: List community library regions with aggregate stats
      description: >-
        Returns the set of regions (US states and countries) that have published
        datasets, each with a count, total file size, and total route distance.
        Datasets whose region could not be determined are omitted.
      responses:
        "200":
          description: List of regions with aggregate stats, most datasets first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityRegionSummary"
  /community/supportal/status:
    get:
      operationId: getSupportalStatus
      tags: [community]
      summary: Check Supportal for newly available trails
      description: >-
        Returns how many GPX trails the upstream Supportal API currently offers,
        how many are already imported into the community library, and how many are
        new. The upstream list is cached briefly server-side so repeated checks are
        cheap. No import happens.
      responses:
        "200":
          description: Supportal availability counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportalStatus"
        "502":
          description: Upstream Supportal API was unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /community/supportal/sync:
    post:
      operationId: syncSupportal
      tags: [community]
      summary: Import new Supportal trails into the community library
      description: >-
        Downloads and parses a batch of not-yet-imported Supportal GPX trails and
        inserts them into the community library. Safe to re-run: already-imported
        trails are skipped. Returns how many were imported, how many failed to
        parse, and how many new trails still remain.
      responses:
        "200":
          description: Import batch processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportalSyncResult"
        "409":
          description: A Supportal sync is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream Supportal API was unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /community/overpass/status:
    get:
      operationId: getOverpassStatus
      tags: [community]
      summary: List US states with imported overlanding road data
      responses:
        "200":
          description: Import status per state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverpassStatus"
  /community/overpass/sync:
    post:
      operationId: syncOverpass
      tags: [community]
      summary: Import or re-import overlanding roads for a US state from OpenStreetMap
      description: >-
        Queries the Overpass API for unpaved roads and tracks in the given US
        state, then upserts a single community dataset of kind "road". Safe to
        re-run: re-importing a state deletes the old dataset and replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverpassSyncBody"
      responses:
        "200":
          description: Import completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverpassSyncResult"
        "409":
          description: An Overpass sync is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream Overpass API was unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /community/datasets:
    get:
      operationId: listCommunityDatasets
      tags: [community]
      summary: List community datasets
      description: >-
        Returns dataset metadata only (no geojson payload). Use the detail
        endpoint to download. When `lat` and `lng` are supplied, results are the
        nearest datasets to that point; otherwise they are newest-first. Always
        capped by `limit` so clients never fetch the entire library at once.
      parameters:
        - in: query
          name: lat
          required: false
          description: User latitude. With `lng`, results are ordered nearest-first.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: lng
          required: false
          description: User longitude. With `lat`, results are ordered nearest-first.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: q
          required: false
          description: Case-insensitive search across name, description, and author.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: region
          required: false
          description: >-
            Exact region name (US state or country) to filter by. When supplied,
            the higher `limit` cap applies so a whole region can be fetched at once.
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          required: false
          description: >-
            Maximum number of datasets to return. The cap is 200 normally, raised
            to 5000 when a `region` filter is supplied.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 50
      responses:
        "200":
          description: List of community datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityDatasetSummary"
    post:
      operationId: createCommunityDataset
      tags: [community]
      summary: Share a dataset with the community
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityDatasetInput"
      responses:
        "201":
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDatasetSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community/datasets/{id}:
    get:
      operationId: getCommunityDataset
      tags: [community]
      summary: Download a community dataset
      description: Returns full dataset including geojson. Increments the download counter.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dataset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDatasetDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community/datasets/bulk:
    post:
      operationId: bulkCreateCommunityDatasets
      tags: [community]
      summary: Bulk-publish map files to the community library
      description: |
        Accepts up to 20 parsed dataset payloads per request. Each item is
        validated and inserted independently so a single malformed payload
        does not fail the whole batch. Returns a per-item result array in
        the same order as the input. Call this endpoint repeatedly in
        parallel batches for large uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityDatasetBatchInput"
      responses:
        "200":
          description: Batch processed — check each result's `success` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDatasetBulkResponse"
        "400":
          description: Top-level validation error (e.g. empty or oversized array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
