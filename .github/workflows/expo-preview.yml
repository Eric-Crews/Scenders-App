name: Expo Preview Builds

on:
  push:
    branches:
      - feat/scenders-production-ui
    paths:
      - .github/workflows/expo-preview.yml
      - artifacts/mobile/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }} preview
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            platform: android
          - name: iOS
            platform: ios

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Build ${{ matrix.name }} preview
        working-directory: artifacts/mobile
        run: >-
          eas build
          --platform ${{ matrix.platform }}
          --profile preview
          --non-interactive
          --wait
          --message "Modern Scenders production UI review"
